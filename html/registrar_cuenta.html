<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIA | Crear Nueva Cuenta</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
   <!-- Contenedor de la pagina para iniciar sesión-->
     <div class="login-card">
        <!-- Encabezado informativo-->
         <div class="login-header">
            <h1>Crear Nueva Cuenta</h1>
            <p>Cree su cuenta para acceder al sistema y a los cursos cortos</p>
         </div>
         <!-- Formulario de inicio de sesión-->
          <form action="#" method="POST">
            <!--campo de nombre-->
            <div class="form-group">
                <label for="name">Nombre</label>
                <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ingrese su nombre completo" required>
            </div>
            <div class="form-group">
                <label for="name">Apellido</label>
                <input type="text" id="apellido" name="apellido" class="form-control" placeholder="Ingrese su nombre completo" required>
            </div>
            
            <!--Campo de usuario o Correo electronico-->
            <div class="form-group">
                <label for="username">Usuario o Correo Electrónico</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Ej: 2021001 o usuario@dominio.com" required>
            </div>
            <!--Campo de contraseña-->
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Ingrese su contraseña" required>
            </div>
            <!--opciones para recordar sesion y recuperar clave de acceso-->
            <div class="form-actions">
                <label class="remmeber-me">
                    <input type="checkbox" name="remember"> 
                    <span> Recordar sesion</span>
                </label>
            </div>
            <!-- Boton de inicio de sesión-->
             <button type="submit" class="btn-submit">Crear Cuenta</button>
             <!--Pie Pagina-->
             <footer class="login-footer">
                <p> derechos reservados &copy; 2023</p>
             </footer>
          </form>
     </div> 
</body>
</html>
